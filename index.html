  <script>
    function switchTab(idx) {
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach((btn, i) => {
        if (i === idx) {
          btn.className = "tab-btn flex-1 h-full rounded-pill bg-white shadow-subtle flex items-center justify-center px-4 transition-all duration-200";
          btn.firstElementChild.className = "w-40 h-4 rounded bg-content-primary";
        } else {
          btn.className = "tab-btn flex-1 h-full rounded-pill bg-transparent hover:bg-white/50 flex items-center justify-center px-4 transition-all duration-200";
          btn.firstElementChild.className = "w-36 h-4 rounded bg-content-muted";
        }
      });
    }

    function toggleAccordion(header) {
      const parent = header.parentElement;
      const body = parent.querySelector('.accordion-body');
      const chevron = header.querySelector('.chevron');
      if (body.classList.contains('hidden')) {
        body.classList.remove('hidden');
        chevron.classList.add('rotate-180');
      } else {
        body.classList.add('hidden');
        chevron.classList.remove('rotate-180');
      }
    }
  </script>
