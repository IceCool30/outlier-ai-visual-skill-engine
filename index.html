<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Outlier Visual Skill Engine | Presentation Layer</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        screens: {
          'xs': '420px',
          'sm': '640px',
          'tablet': '810px',
          'md': '810px',
          'lg': '1024px',
          'desktop': '1280px',
          'xl': '1280px'
        },
        extend: {
          colors: {
            brand: {
              primary: '#F7803C',
              hover: '#FF8D4D',
              active: '#EF6000',
              deep: '#BA561D',
              link: '#CF6325',
              tint: {
                100: '#FFF9F7',
                200: '#FEFBF5',
                300: '#FDF4E7',
                400: '#FCF3ED',
                500: '#FFE2D7'
              }
            },
            surface: {
              canvas: '#FFFFFF',
              light: {
                50: '#FAFAFA',
                100: '#F7F7F8',
                200: '#F5F5F5',
                300: '#F2F4F7',
                400: '#EBECED'
              },
              dark: {
                900: '#0F0F10',
                850: '#131316',
                800: '#1A1C1E',
                700: '#222222',
                600: '#2C2D30'
              }
            },
            content: {
              primary: '#000000',
              secondary: '#111111',
              tertiary: '#404245',
              muted: '#777777',
              subtle: '#80858F',
              inverse: '#FFFFFF'
            },
            border: {
              subtle: '#CFD1D5',
              light: '#DDDDDD',
              dark: '#2C2D30',
              hairline: 'rgba(0, 0, 0, 0.08)'
            },
            domain: {
              purple: { base: '#7A72F1', dark: '#312B83', light: '#B3AEF7', bg: '#F3F3FF', border: '#E5E6FF' },
              lime: { base: '#DAFF85', dark: '#0A7A22', light: '#DFFF7B', bg: '#F9FFE7', border: '#D5F5A3' },
              cyan: { base: '#6BD4EB', dark: '#1970C2', light: '#D4F1F8', bg: '#F4F9FF', border: '#C9DFFF' },
              amber: { base: '#FABB00', dark: '#7C7000', light: '#FFE094', bg: '#FFF9EA', border: '#FCE5B2' },
              rose: { base: '#F7C7C8', dark: '#A30F0F', light: '#FFE2D7', bg: '#FFF9F7', border: '#FFD9D9' }
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"Fragment Mono"', 'ui-monospace', 'monospace']
          },
          borderRadius: {
            'pill': '120px',
            'banner': '48px',
            'banner-tablet': '32px',
            'banner-mobile': '24px',
            'sub-banner': '36px',
            'sub-banner-tablet': '28px',
            'sub-banner-mobile': '20px',
            'container': '16px',
            'card': '12px',
            'control': '8px',
            'badge': '6px'
          },
          boxShadow: {
            'subtle': '0px 2px 4px 0px rgba(0, 0, 0, 0.05), 0px 1px 0px 0px rgba(0, 0, 0, 0.03)',
            'card': '0px 2px 10px -3px rgba(153, 153, 153, 0.25)',
            'floating': '0px 10px 30px -10px rgba(0, 0, 0, 0.08), 0px 4px 6px -2px rgba(0, 0, 0, 0.03)',
            'drawer': '0px 25px 50px -12px rgba(0, 0, 0, 0.25)',
            'glow-coral': '0px 0px 24px 0px rgba(247, 128, 60, 0.25)'
          },
          backgroundImage: {
            'hero-fade': 'linear-gradient(180deg, #FBFBFB 0%, rgba(217, 217, 217, 0) 100%)',
            'workbench-pearlescent': 'linear-gradient(270deg, #F0FCFF 0%, #FFFFFF 50%, #FCEBE1 105%)',
            'card-subtle': 'linear-gradient(180deg, #FFFFFF 0%, #EEEEEE 100%)',
            'timeline-glow': 'linear-gradient(270deg, #FFE2D7 0%, rgba(141, 228, 255, 0.36) 100%)',
            'cta-horizon': 'linear-gradient(90deg, rgba(199, 243, 255, 0.38) 25%, #F7C7C8 100%)',
            'stat-cobalt': 'linear-gradient(225deg, rgba(25, 112, 194, 0.1) 0%, #1970C2 100%)',
            'stat-crimson': 'linear-gradient(202deg, rgba(163, 15, 15, 0.1) 0%, #A30F0F 100%)',
            'stat-emerald': 'linear-gradient(202deg, rgba(17, 143, 44, 0.1) 0%, #0A7A22 94%)',
            'footer-fade': 'linear-gradient(180deg, #FFFFFF 31%, #EEEEEE 100%)'
          },
          animation: {
            'marquee': 'marquee 35s linear infinite'
          },
          keyframes: {
            marquee: {
              '0%': { transform: 'translateX(0%)' },
              '100%': { transform: 'translateX(-50%)' }
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./styles/tokens.css">
  <style>
    .scrollbar-none::-webkit-scrollbar { display: none; }

</head>
<body class="bg-surface-canvas text-content-primary font-sans antialiased selection:bg-brand-primary selection:text-white">

  <!-- ========================================================================
       1. FLOATING NAVIGATION BAR (76px Desktop / 68px Mobile, Mobile Drawer)
       ======================================================================== -->
  <header class="w-full h-[68px] sm:h-[76px] sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-border-hairline transition-all duration-200">
    <div class="max-w-[1280px] mx-auto h-full px-4 sm:px-6 md:px-10 flex items-center justify-between">
      
      <!-- Brand Logo / Mark Slot -->
      <div class="flex items-center gap-2.5 sm:gap-3 cursor-pointer shrink-0">
        <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-lg bg-content-primary flex items-center justify-center">
          <div class="w-3 h-3 sm:w-4 sm:h-4 rounded-full bg-brand-primary"></div>
        </div>
        <div class="h-4 sm:h-5 w-20 sm:w-24 rounded bg-surface-light-400"></div>
      </div>

      <!-- Links List (Desktop) -->
      <nav class="hidden md:flex items-center gap-8">
        <div class="h-4 w-16 rounded bg-surface-light-400 hover:bg-content-secondary transition-colors cursor-pointer"></div>
        <div class="h-4 w-20 rounded bg-surface-light-400 hover:bg-content-secondary transition-colors cursor-pointer"></div>
        <div class="h-4 w-12 rounded bg-surface-light-400 hover:bg-content-secondary transition-colors cursor-pointer"></div>
        <div class="h-4 w-16 rounded bg-surface-light-400 hover:bg-content-secondary transition-colors cursor-pointer"></div>
      </nav>

      <!-- Utility & Primary Pill Action -->
      <div class="flex items-center gap-3 sm:gap-4">
        <div class="hidden sm:block h-4 w-12 rounded bg-surface-light-400 cursor-pointer"></div>
        
        <!-- Primary Action Pill -->
        <a href="#action" class="inline-flex items-center justify-center h-9 sm:h-10 px-4 sm:px-6 rounded-pill bg-brand-primary text-content-primary font-semibold text-xs sm:text-sm transition-all duration-200 hover:bg-brand-hover hover:scale-[1.02] active:bg-brand-active shadow-subtle shrink-0">
          <span class="w-16 sm:w-24 h-3.5 rounded bg-content-primary/25"></span>
        </a>

        <!-- Mobile Hamburger Toggle -->
        <button onclick="toggleMobileNav()" class="md:hidden p-2 rounded-lg text-content-primary hover:bg-surface-light-100 transition-colors" aria-label="Toggle Navigation Menu">
          <svg id="hamburger-icon" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <svg id="close-icon" class="w-6 h-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

    </div>

    <!-- Mobile Slide-Down Menu Drawer (Solid Opaque White, High Elevation) -->
    <div id="mobile-nav-drawer" class="hidden md:hidden fixed inset-x-0 top-[68px] sm:top-[76px] bg-white border-b border-border-hairline shadow-2xl px-6 py-6 flex flex-col gap-4 z-50 transition-all duration-200">
      <div class="h-4 w-24 rounded bg-surface-light-400"></div>
      <div class="h-4 w-32 rounded bg-surface-light-400"></div>
      <div class="h-4 w-28 rounded bg-surface-light-400"></div>
      <div class="h-4 w-20 rounded bg-surface-light-400"></div>
      <div class="pt-3 border-t border-border-hairline">
        <div class="w-full h-11 rounded-pill bg-brand-primary flex items-center justify-center">
          <div class="w-28 h-3.5 rounded bg-content-primary/30"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- ========================================================================
       2. HERO PRESENTATION SECTION
       ======================================================================== -->
  <section class="w-full relative overflow-hidden bg-hero-fade pt-10 sm:pt-14 pb-12 sm:pb-16 md:py-20 flex flex-col items-center">
    <div class="absolute -top-24 sm:-top-32 left-1/2 -translate-x-1/2 w-[340px] sm:w-[600px] md:w-[700px] h-[220px] sm:h-[350px] bg-brand-primary/10 rounded-full blur-[70px] sm:blur-[100px] pointer-events-none" aria-hidden="true"></div>

    <div class="max-w-[1280px] w-full mx-auto px-4 sm:px-6 md:px-10 flex flex-col items-center text-center relative z-10">
      
      <!-- Overline Tag -->
      <div class="inline-flex items-center gap-1.5 sm:gap-2 px-3 sm:px-4 py-1 sm:py-1.5 rounded-full bg-brand-tint-300 border border-brand-deep/20 mb-5 sm:mb-6">
        <span class="w-1.5 sm:w-2 h-1.5 sm:h-2 rounded-full bg-brand-deep animate-pulse"></span>
        <div class="h-3 sm:h-3.5 w-28 sm:w-36 rounded bg-brand-deep/30"></div>
      </div>

      <!-- Display Title (H1 Fluid Responsive) -->
      <h1 class="max-w-[840px] text-3xl xs:text-4xl sm:text-5xl desktop:text-[54px] font-semibold text-content-primary tracking-[-0.8px] sm:tracking-[-1.5px] leading-[1.18] mb-4 sm:mb-6 flex flex-col items-center gap-2 sm:gap-3 w-full px-1">
        <span class="w-full max-w-[760px] h-9 sm:h-12 md:h-14 rounded-md bg-surface-light-400"></span>
        <span class="w-3/4 max-w-[540px] h-9 sm:h-12 md:h-14 rounded-md bg-surface-light-400"></span>
      </h1>

      <!-- Subtitle -->
      <p class="max-w-[640px] text-sm sm:text-base md:text-xl text-content-tertiary leading-[1.5] mb-8 sm:mb-10 flex flex-col items-center gap-2 w-full px-2">
        <span class="w-full max-w-[580px] h-4 sm:h-5 rounded bg-surface-light-300"></span>
        <span class="w-4/5 max-w-[460px] h-4 sm:h-5 rounded bg-surface-light-300"></span>
      </p>

      <!-- Primary Action CTA -->
      <div class="w-full sm:w-auto flex flex-col sm:flex-row items-center justify-center gap-4 mb-10 sm:mb-14 px-4">
        <a href="#action" class="w-full sm:w-auto max-w-xs inline-flex items-center justify-center px-8 sm:px-10 py-3.5 sm:py-5 rounded-pill bg-brand-primary text-content-primary font-semibold text-base sm:text-lg transition-all duration-200 hover:bg-brand-hover hover:scale-[1.02] active:bg-brand-active shadow-glow-coral">
          <span class="w-32 sm:w-36 h-4 rounded bg-content-primary/30"></span>
        </a>
      </div>

    </div>

    <!-- ========================================================================
         3. DUAL-CARD HORIZONTAL MARQUEE TICKER (Fluid Mobile-Scaled)
         ======================================================================== -->
    <div class="w-full overflow-hidden py-2 sm:py-4 select-none relative" aria-hidden="true">
      <div class="absolute left-0 top-0 bottom-0 w-8 sm:w-16 md:w-24 bg-gradient-to-r from-surface-canvas to-transparent z-10 pointer-events-none"></div>
      <div class="absolute right-0 top-0 bottom-0 w-8 sm:w-16 md:w-24 bg-gradient-to-l from-surface-canvas to-transparent z-10 pointer-events-none"></div>

      <div class="flex gap-3 sm:gap-4 md:gap-5 w-max animate-marquee hover:[animation-play-state:paused]">
        
        <!-- Item 1: Profile Card -->
        <div class="w-[155px] sm:w-[185px] md:w-[209px] h-[270px] sm:h-[330px] md:h-[400px] flex flex-col justify-end">
          <div class="w-full h-[195px] sm:h-[245px] md:h-[296px] rounded-card bg-surface-light-300 relative overflow-hidden flex flex-col justify-end p-3 sm:p-4 border border-border-hairline shadow-subtle">
            <div class="absolute inset-0 bg-gradient-to-t from-[#163F57]/90 via-[#163F57]/30 to-transparent"></div>
            <div class="relative z-10 flex flex-col gap-1.5">
              <div class="h-3.5 sm:h-4 w-16 sm:w-20 rounded bg-white/80"></div>
              <div class="h-2.5 sm:h-3 w-20 sm:w-28 rounded bg-white/50"></div>
            </div>
          </div>
        </div>

        <!-- Item 2: Stat Card Cobalt + Profile Mini Stack -->
        <div class="w-[155px] sm:w-[185px] md:w-[209px] h-[270px] sm:h-[330px] md:h-[400px] flex flex-col justify-between">
          <div class="w-full h-[85px] sm:h-[105px] md:h-[127px] rounded-card bg-stat-cobalt p-2.5 sm:p-3.5 md:p-4 flex flex-col justify-between border border-white/10 shadow-card">
            <div class="h-5 sm:h-7 w-20 sm:w-24 rounded bg-white/90"></div>
            <div class="h-3 sm:h-4 w-24 sm:w-32 rounded bg-white/70"></div>
          </div>
          <div class="w-full h-[170px] sm:h-[210px] md:h-[250px] rounded-card bg-surface-light-300 relative overflow-hidden flex flex-col justify-end p-3 sm:p-4 border border-border-hairline">
            <div class="absolute inset-0 bg-gradient-to-t from-[#80137C]/90 via-[#80137C]/30 to-transparent"></div>
            <div class="relative z-10 flex flex-col gap-1.5">
              <div class="h-3.5 sm:h-4 w-18 sm:w-24 rounded bg-white/80"></div>
              <div class="h-2.5 sm:h-3 w-22 sm:w-32 rounded bg-white/50"></div>
            </div>
          </div>
        </div>

        <!-- Item 3: Profile Card -->
        <div class="w-[155px] sm:w-[185px] md:w-[209px] h-[270px] sm:h-[330px] md:h-[400px] flex flex-col justify-end">
          <div class="w-full h-[195px] sm:h-[245px] md:h-[296px] rounded-card bg-surface-light-300 relative overflow-hidden flex flex-col justify-end p-3 sm:p-4 border border-border-hairline shadow-subtle">
            <div class="absolute inset-0 bg-gradient-to-t from-[#0B7525]/90 via-[#0B7525]/30 to-transparent"></div>
            <div class="relative z-10 flex flex-col gap-1.5">
              <div class="h-3.5 sm:h-4 w-16 sm:w-20 rounded bg-white/80"></div>
              <div class="h-2.5 sm:h-3 w-20 sm:w-28 rounded bg-white/50"></div>
            </div>
          </div>
        </div>

        <!-- Item 4: Stat Card Crimson + Profile Mini Stack -->
        <div class="w-[155px] sm:w-[185px] md:w-[209px] h-[270px] sm:h-[330px] md:h-[400px] flex flex-col justify-between">
          <div class="w-full h-[170px] sm:h-[210px] md:h-[250px] rounded-card bg-surface-light-300 relative overflow-hidden flex flex-col justify-end p-3 sm:p-4 border border-border-hairline">
            <div class="absolute inset-0 bg-gradient-to-t from-[#7B8F0B]/90 via-[#7B8F0B]/30 to-transparent"></div>
            <div class="relative z-10 flex flex-col gap-1.5">
              <div class="h-3.5 sm:h-4 w-18 sm:w-24 rounded bg-white/80"></div>
              <div class="h-2.5 sm:h-3 w-22 sm:w-32 rounded bg-white/50"></div>
            </div>
          </div>
          <div class="w-full h-[85px] sm:h-[105px] md:h-[127px] rounded-card bg-stat-crimson p-2.5 sm:p-3.5 md:p-4 flex flex-col justify-between border border-white/10 shadow-card">
            <div class="h-5 sm:h-7 w-20 sm:w-24 rounded bg-white/90"></div>
            <div class="h-3 sm:h-4 w-24 sm:w-32 rounded bg-white/70"></div>
          </div>
        </div>

        <!-- Item 5: Stat Card Emerald -->
        <div class="w-[155px] sm:w-[185px] md:w-[209px] h-[270px] sm:h-[330px] md:h-[400px] flex flex-col justify-between">
          <div class="w-full h-[170px] sm:h-[210px] md:h-[250px] rounded-card bg-surface-light-300 relative overflow-hidden flex flex-col justify-end p-3 sm:p-4 border border-border-hairline">
            <div class="absolute inset-0 bg-gradient-to-t from-[#444444]/90 via-[#444444]/30 to-transparent"></div>
            <div class="relative z-10 flex flex-col gap-1.5">
              <div class="h-3.5 sm:h-4 w-18 sm:w-24 rounded bg-white/80"></div>
              <div class="h-2.5 sm:h-3 w-22 sm:w-32 rounded bg-white/50"></div>
            </div>
          </div>
          <div class="w-full h-[85px] sm:h-[105px] md:h-[127px] rounded-card bg-stat-emerald p-2.5 sm:p-3.5 md:p-4 flex flex-col justify-between border border-white/10 shadow-card">
            <div class="h-5 sm:h-7 w-20 sm:w-24 rounded bg-white/90"></div>
            <div class="h-3 sm:h-4 w-24 sm:w-32 rounded bg-white/70"></div>
          </div>
        </div>

        <!-- Duplicated items for continuous loop -->
        <div class="w-[155px] sm:w-[185px] md:w-[209px] h-[270px] sm:h-[330px] md:h-[400px] flex flex-col justify-end">
          <div class="w-full h-[195px] sm:h-[245px] md:h-[296px] rounded-card bg-surface-light-300 relative overflow-hidden flex flex-col justify-end p-3 sm:p-4 border border-border-hairline shadow-subtle">
            <div class="absolute inset-0 bg-gradient-to-t from-[#163F57]/90 via-[#163F57]/30 to-transparent"></div>
            <div class="relative z-10 flex flex-col gap-1.5">
              <div class="h-3.5 sm:h-4 w-16 sm:w-20 rounded bg-white/80"></div>
              <div class="h-2.5 sm:h-3 w-20 sm:w-28 rounded bg-white/50"></div>
            </div>
          </div>
        </div>

        <div class="w-[155px] sm:w-[185px] md:w-[209px] h-[270px] sm:h-[330px] md:h-[400px] flex flex-col justify-between">
          <div class="w-full h-[85px] sm:h-[105px] md:h-[127px] rounded-card bg-stat-cobalt p-2.5 sm:p-3.5 md:p-4 flex flex-col justify-between border border-white/10 shadow-card">
            <div class="h-5 sm:h-7 w-20 sm:w-24 rounded bg-white/90"></div>
            <div class="h-3 sm:h-4 w-24 sm:w-32 rounded bg-white/70"></div>
          </div>
          <div class="w-full h-[170px] sm:h-[210px] md:h-[250px] rounded-card bg-surface-light-300 relative overflow-hidden flex flex-col justify-end p-3 sm:p-4 border border-border-hairline">
            <div class="absolute inset-0 bg-gradient-to-t from-[#80137C]/90 via-[#80137C]/30 to-transparent"></div>
            <div class="relative z-10 flex flex-col gap-1.5">
              <div class="h-3.5 sm:h-4 w-18 sm:w-24 rounded bg-white/80"></div>
              <div class="h-2.5 sm:h-3 w-22 sm:w-32 rounded bg-white/50"></div>
            </div>
          </div>
        </div>

      </div>
    </div>

  </section>

  <!-- ========================================================================
       4. INTERACTIVE WORKBENCH & TABBED STAGE (Responsive Stacked Pills on Mobile)
       ======================================================================== -->
  <section class="w-full py-14 sm:py-20 md:py-28 px-4 sm:px-6 md:px-14 flex flex-col items-center bg-surface-canvas">
    <div class="max-w-[1280px] w-full mx-auto flex flex-col items-center gap-8 sm:gap-12">
      
      <!-- Section Header -->
      <div class="flex flex-col items-center text-center max-w-[780px] gap-3 px-2">
        <span class="text-[11px] sm:text-xs md:text-sm font-semibold tracking-[2px] uppercase text-brand-deep">
          <span class="inline-block w-40 sm:w-48 h-3.5 rounded bg-brand-deep/30"></span>
        </span>
        <h2 class="text-2xl sm:text-3xl tablet:text-4xl desktop:text-[40px] font-semibold text-content-primary tracking-tight leading-[1.25] flex flex-col items-center gap-2">
          <span class="w-full max-w-[620px] h-8 sm:h-10 md:h-11 rounded-md bg-surface-light-400"></span>
        </h2>
        <p class="text-sm sm:text-base text-content-tertiary max-w-[600px] flex flex-col items-center gap-2">
          <span class="w-full max-w-[520px] h-4 rounded bg-surface-light-300"></span>
        </p>
      </div>

      <!-- Segmented Pill Tab Bar (Stacked on mobile, unified pill on desktop) -->
      <div class="w-full max-w-[1160px] p-1.5 sm:p-2 md:p-3 rounded-2xl md:rounded-pill bg-surface-light-200 flex flex-col sm:flex-row gap-1.5 sm:gap-2 border border-border-hairline shadow-inner" id="tab-controller">
        <button onclick="switchTab(0)" class="tab-btn w-full sm:flex-1 py-2.5 sm:py-3.5 md:py-4 px-4 rounded-xl md:rounded-pill bg-white shadow-subtle flex items-center justify-center transition-all duration-200" data-tab="0">
          <div class="w-32 sm:w-40 h-3.5 sm:h-4 rounded bg-content-primary"></div>
        </button>
        <button onclick="switchTab(1)" class="tab-btn w-full sm:flex-1 py-2.5 sm:py-3.5 md:py-4 px-4 rounded-xl md:rounded-pill bg-transparent hover:bg-white/50 flex items-center justify-center transition-all duration-200" data-tab="1">
          <div class="w-28 sm:w-36 h-3.5 sm:h-4 rounded bg-content-muted"></div>
        </button>
        <button onclick="switchTab(2)" class="tab-btn w-full sm:flex-1 py-2.5 sm:py-3.5 md:py-4 px-4 rounded-xl md:rounded-pill bg-transparent hover:bg-white/50 flex items-center justify-center transition-all duration-200" data-tab="2">
          <div class="w-28 sm:w-36 h-3.5 sm:h-4 rounded bg-content-muted"></div>
        </button>
      </div>

      <!-- Pearlescent Interactive Stage Surface (Fluid radii: 24px mobile, 48px desktop) -->
      <div class="w-full max-w-[1160px] rounded-[24px] sm:rounded-[32px] md:rounded-banner bg-workbench-pearlescent p-5 sm:p-8 md:p-14 border border-border-subtle/40 shadow-card flex flex-col lg:flex-row items-center gap-8 sm:gap-10 lg:gap-14">
        
        <!-- Left: Metadata Descriptions -->
        <div class="flex-1 flex flex-col gap-6 sm:gap-8 w-full">
          <div class="flex flex-col gap-2.5">
            <div class="w-56 sm:w-64 h-7 sm:h-8 rounded-md bg-content-primary"></div>

  <!-- Minimal Vanilla UI Interactions Script -->
  <script>
    function switchTab(idx) {
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach((btn, i) => {
        if (i === idx) {
          btn.className = "tab-btn w-full sm:flex-1 py-2.5 sm:py-3.5 md:py-4 px-4 rounded-xl md:rounded-pill bg-white shadow-subtle flex items-center justify-center transition-all duration-200";
          btn.firstElementChild.className = "w-32 sm:w-40 h-3.5 sm:h-4 rounded bg-content-primary";
        } else {
          btn.className = "tab-btn w-full sm:flex-1 py-2.5 sm:py-3.5 md:py-4 px-4 rounded-xl md:rounded-pill bg-transparent hover:bg-white/50 flex items-center justify-center transition-all duration-200";
          btn.firstElementChild.className = "w-28 sm:w-36 h-3.5 sm:h-4 rounded bg-content-muted";
        }
      });
    }

    function toggleAccordion(header) {
      const parent = header.parentElement;
      const body = parent.querySelector('.accordion-body');
      const chevron = header.querySelector('.chevron');
      if (body.classList.contains('hidden')) {
        body.classList.remove('hidden');
        chevron.classList.add('rotate-180');
      } else {
        body.classList.add('hidden');
        chevron.classList.remove('rotate-180');
      }
    }

    function toggleMobileNav() {
      const drawer = document.getElementById('mobile-nav-drawer');
      const hamburger = document.getElementById('hamburger-icon');
      const close = document.getElementById('close-icon');
      if (drawer.classList.contains('hidden')) {
        drawer.classList.remove('hidden');
        hamburger.classList.add('hidden');
        close.classList.remove('hidden');
      } else {
        drawer.classList.add('hidden');
        hamburger.classList.remove('hidden');
        close.classList.add('hidden');
      }
    }

    function scrollTrack(dir) {
      const track = document.getElementById('carousel-track');
      const cardWidth = track.firstElementChild ? track.firstElementChild.offsetWidth + 24 : 320;
      track.scrollBy({ left: dir * cardWidth, behavior: 'smooth' });
    }
  </script>
