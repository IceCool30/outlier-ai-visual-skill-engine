<!-- ==========================================================================
     OUTLIER ARCHETYPE: HORIZON GLOW BOTTOM CTA BANNER SKELETON
     Aesthetic Mechanics:
     - Dimension: 1160px max-width, 356px height
     - Border Radius: 36px (sub-banner)
     - Padding: 100px 80px (Desktop), 60px 24px (Mobile)
     - Gradient: linear-gradient(90deg, rgba(199, 243, 255, 0.38) 25%, #F7C7C8 100%)
     - High-Contrast Inverted Action Button: 120px radius, bg: #000000, text: #FFFFFF
     ========================================================================== -->

<section class="w-full py-16 md:py-24 px-6 md:px-14 flex flex-col items-center bg-white">
  <div class="w-full max-w-content rounded-sub-banner bg-cta-horizon p-10 md:p-20 flex flex-col items-center text-center justify-center gap-10 border border-white/60 shadow-floating relative overflow-hidden">
    
    <!-- Ambient Internal Highlight -->
    <div class="absolute -top-20 -left-20 w-64 h-64 rounded-full bg-white/40 blur-2xl pointer-events-none" aria-hidden="true"></div>

    <!-- Centered Call To Action Headline (H2 Display) -->
    <h2 class="text-h2-mobile tablet:text-h2-tablet desktop:text-h2-desktop font-semibold text-content-primary tracking-tight leading-[1.3] max-w-[700px] flex flex-col items-center gap-2 relative z-10">
      <span class="w-full max-w-[560px] h-10 md:h-12 rounded-md bg-content-primary"></span>
    </h2>

    <!-- Inverted High-Contrast Pill Button -->
    <a href="#" class="inline-flex items-center justify-center px-10 py-5 rounded-pill bg-content-primary text-white font-semibold text-lg transition-all duration-200 hover:bg-content-secondary hover:scale-[1.02] active:scale-[0.98] shadow-floating relative z-10">
      <span class="w-32 h-4 rounded bg-white/40"></span>
    </a>

  </div>
</section>
