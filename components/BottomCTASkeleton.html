     Aesthetic Mechanics:
     - Dimension: 1160px max-width
     - Border Radius: 36px (Desktop) / 28px (Tablet) / 24px (Mobile)
     - Padding: 80px (Desktop), 56px 32px (Tablet), 40px 20px (Mobile)

<section class="w-full py-14 sm:py-20 md:py-28 px-4 sm:px-6 md:px-14 flex flex-col items-center bg-white">
  <div class="w-full max-w-content rounded-[24px] sm:rounded-[32px] md:rounded-sub-banner bg-cta-horizon py-10 px-5 sm:py-14 sm:px-8 md:py-20 md:px-20 flex flex-col items-center text-center justify-center gap-6 sm:gap-8 md:gap-10 border border-white/60 shadow-floating relative overflow-hidden">

    <div class="absolute -top-20 -left-20 w-48 sm:w-64 h-48 sm:h-64 rounded-full bg-white/40 blur-2xl pointer-events-none" aria-hidden="true"></div>

    <!-- Centered Call To Action Headline (H2 Display) -->

      <span class="w-full max-w-[560px] h-8 sm:h-10 md:h-12 rounded-md bg-content-primary"></span>
    </h2>

    <!-- Inverted High-Contrast Pill Button -->
    <a href="#" class="w-full sm:w-auto max-w-xs inline-flex items-center justify-center px-8 sm:px-10 py-3.5 sm:py-5 rounded-pill bg-content-primary text-white font-semibold text-base sm:text-lg transition-all duration-200 hover:bg-content-secondary hover:scale-[1.02] active:scale-[0.98] shadow-floating relative z-10">
      <span class="w-32 h-4 rounded bg-white/40"></span>

  </div>
