<!-- ==========================================================================
     OUTLIER ARCHETYPE: 4-STEP PROGRESSIVE ONBOARDING TIMELINE SKELETON
     Aesthetic Mechanics:
     - Section Rhythm: 100px 60px padding, 48px gap
     - Layout: 2-column split (Left: Numbered steps list, Right: Glow preview card)
     - Left Column: 4 items (01, 02, 03, 04) with bold numerals (font-weight: 600, color: #000)
     - Right Column: 564px width, 451px height, 16px radius, 8px padding
     - Right Surface: Glow gradient (linear-gradient(270deg, #FFE2D7 0%, rgba(141, 228, 255, 0.36) 100%))
     ========================================================================== -->

<section class="w-full py-16 md:py-24 px-6 md:px-14 flex flex-col items-center bg-white">
  <div class="max-w-page w-full mx-auto flex flex-col items-center gap-12">
    
    <!-- Section Header -->
    <div class="flex flex-col items-center text-center max-w-[800px] gap-4">
      <span class="text-eyebrow-sm md:text-eyebrow font-semibold tracking-[2px] uppercase text-brand-deep">
        <span class="inline-block w-36 h-3.5 rounded bg-brand-deep/30"></span>
      </span>
      <h2 class="text-h2-mobile tablet:text-h2-tablet desktop:text-h2-desktop font-semibold text-content-primary tracking-tight leading-[1.3] flex flex-col items-center gap-2">
        <span class="w-full max-w-[560px] h-9 md:h-11 rounded-md bg-surface-light-400"></span>
      </h2>
    </div>

    <!-- 2-Column Split: Steps List Left, Interactive Preview Right -->
    <div class="w-full max-w-content flex flex-col lg:flex-row items-center gap-10 lg:gap-12">
      
      <!-- Left Column: Numbered Step Items -->
      <div class="flex-1 w-full space-y-4">
        
        <!-- Step 1 (Active) -->
        <div class="p-6 rounded-card bg-surface-light-100 border-l-4 border-brand-primary shadow-subtle flex items-start gap-5 transition-all duration-200">
          <span class="font-mono text-2xl font-bold text-brand-deep">01</span>
          <div class="flex-1 space-y-2">
            <div class="w-44 h-5 rounded bg-content-primary"></div>
            <div class="w-full max-w-sm h-3.5 rounded bg-content-tertiary/40"></div>
          </div>
        </div>

        <!-- Step 2 -->
        <div class="p-6 rounded-card bg-white border border-border-hairline flex items-start gap-5 hover:bg-surface-light-50 transition-colors cursor-pointer">
          <span class="font-mono text-2xl font-bold text-content-muted">02</span>
          <div class="flex-1 space-y-2">
            <div class="w-48 h-5 rounded bg-content-secondary"></div>
            <div class="w-3/4 h-3.5 rounded bg-content-tertiary/20"></div>
          </div>
        </div>

        <!-- Step 3 -->
        <div class="p-6 rounded-card bg-white border border-border-hairline flex items-start gap-5 hover:bg-surface-light-50 transition-colors cursor-pointer">
          <span class="font-mono text-2xl font-bold text-content-muted">03</span>
          <div class="flex-1 space-y-2">
            <div class="w-40 h-5 rounded bg-content-secondary"></div>
            <div class="w-2/3 h-3.5 rounded bg-content-tertiary/20"></div>
          </div>
        </div>

        <!-- Step 4 -->
        <div class="p-6 rounded-card bg-white border border-border-hairline flex items-start gap-5 hover:bg-surface-light-50 transition-colors cursor-pointer">
          <span class="font-mono text-2xl font-bold text-content-muted">04</span>
          <div class="flex-1 space-y-2">
            <div class="w-52 h-5 rounded bg-content-secondary"></div>
            <div class="w-3/4 h-3.5 rounded bg-content-tertiary/20"></div>
          </div>
        </div>

      </div>

      <!-- Right Column: Glow Step Preview Surface -->
      <div class="flex-1 w-full flex justify-center">
        <div class="w-full max-w-[564px] h-[451px] rounded-container bg-timeline-glow p-2 border border-border-subtle/30 shadow-card flex items-center justify-center">
          
          <!-- Inner Mockup Viewport -->
          <div class="w-full h-full rounded-card bg-white p-6 flex flex-col justify-between shadow-subtle border border-white/80">
            <!-- Header bar -->
            <div class="flex items-center justify-between pb-4 border-b border-border-hairline">
              <div class="w-32 h-4 rounded bg-content-primary"></div>
              <div class="w-16 h-4 rounded-badge bg-domain-lime-bg"></div>
            </div>

            <!-- Form fields / Profile mock -->
            <div class="space-y-4 my-auto">
              <div class="space-y-1.5">
                <div class="w-20 h-3 rounded bg-content-tertiary/40"></div>
                <div class="w-full h-10 rounded-control bg-surface-light-100 border border-border-hairline"></div>
              </div>
              <div class="space-y-1.5">
                <div class="w-24 h-3 rounded bg-content-tertiary/40"></div>
                <div class="w-full h-10 rounded-control bg-surface-light-100 border border-border-hairline"></div>
              </div>
              <!-- Skill badge pills -->
              <div class="flex flex-wrap gap-2 pt-2">
                <div class="w-16 h-6 rounded-pill bg-domain-purple-bg"></div>
                <div class="w-20 h-6 rounded-pill bg-domain-cyan-bg"></div>
                <div class="w-24 h-6 rounded-pill bg-domain-amber-bg"></div>
              </div>
            </div>

            <!-- Bottom Progress -->
            <div class="pt-4 border-t border-border-hairline flex items-center justify-between">
              <div class="w-24 h-3 rounded bg-content-tertiary/30"></div>
              <div class="h-8 px-5 rounded-pill bg-brand-primary flex items-center justify-center">
                <div class="w-12 h-2.5 rounded bg-content-primary/30"></div>
              </div>
            </div>

          </div>

        </div>
      </div>

    </div>

  </div>
</section>
