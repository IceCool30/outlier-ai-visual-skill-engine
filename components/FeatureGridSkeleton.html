<!-- ==========================================================================
     OUTLIER ARCHETYPE: 2x2 FEATURE BENEFIT GRID SKELETON
     Aesthetic Mechanics:
     - Container: 1280px max-width, 100px 60px padding, 48px gap
     - Grid: 2 columns on desktop (gap: 24px), 1 column on mobile (gap: 16px)
     - Card Dimension: 568px width, 420px height, 12px radius, 40px padding
     - Surface: Subtle depth gradient (linear-gradient(180deg, #FFFFFF 0%, #EEEEEE 100%))
     - Hierarchy: Illustration frame upper half, Typography lockup lower half
     ========================================================================== -->

<section class="w-full py-16 md:py-24 px-6 md:px-14 flex flex-col items-center bg-white">
  <div class="max-w-page w-full mx-auto flex flex-col items-center gap-12">
    
    <!-- Section Header -->
    <div class="flex flex-col items-center text-center max-w-[800px] gap-4">
      <span class="text-eyebrow-sm md:text-eyebrow font-semibold tracking-[2px] uppercase text-brand-deep">
        <span class="inline-block w-40 h-3.5 rounded bg-brand-deep/30"></span>
      </span>
      <h2 class="text-h2-mobile tablet:text-h2-tablet desktop:text-h2-desktop font-semibold text-content-primary tracking-tight leading-[1.3] flex flex-col items-center gap-2">
        <span class="w-full max-w-[640px] h-9 md:h-11 rounded-md bg-surface-light-400"></span>
        <span class="w-3/4 max-w-[480px] h-9 md:h-11 rounded-md bg-surface-light-400"></span>
      </h2>
      <p class="text-body-sm md:text-body-md text-content-tertiary max-w-[640px] flex flex-col items-center gap-2">
        <span class="w-full max-w-[560px] h-4 rounded bg-surface-light-300"></span>
      </p>
    </div>

    <!-- 2x2 Grid Container -->
    <div class="w-full max-w-content grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Card 1: Feature Block -->
      <div class="w-full h-[420px] rounded-card bg-card-subtle p-8 md:p-10 border border-border-hairline shadow-subtle flex flex-col justify-between hover:scale-[1.01] transition-transform duration-200">
        <!-- Visual Presentation Slot -->
        <div class="w-full h-[220px] rounded-control bg-surface-light-100/60 flex items-center justify-center relative overflow-hidden">
          <div class="w-24 h-24 rounded-full bg-brand-primary/10 flex items-center justify-center">
            <div class="w-12 h-12 rounded-full bg-brand-primary/20"></div>
          </div>
        </div>
        <!-- Typography Anchor (H4) -->
        <div class="flex flex-col gap-2">
          <div class="w-4/5 h-6 rounded bg-content-primary"></div>
          <div class="w-3/5 h-6 rounded bg-content-primary"></div>
        </div>
      </div>

      <!-- Card 2: Feature Block -->
      <div class="w-full h-[420px] rounded-card bg-card-subtle p-8 md:p-10 border border-border-hairline shadow-subtle flex flex-col justify-between hover:scale-[1.01] transition-transform duration-200">
        <div class="w-full h-[220px] rounded-control bg-surface-light-100/60 flex items-center justify-center relative overflow-hidden">
          <div class="w-32 h-16 rounded-pill bg-domain-lime-light/30 flex items-center justify-center">
            <div class="w-20 h-4 rounded bg-domain-lime-dark/30"></div>
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <div class="w-full h-6 rounded bg-content-primary"></div>
          <div class="w-1/2 h-6 rounded bg-content-primary"></div>
        </div>
      </div>

      <!-- Card 3: Feature Block -->
      <div class="w-full h-[420px] rounded-card bg-card-subtle p-8 md:p-10 border border-border-hairline shadow-subtle flex flex-col justify-between hover:scale-[1.01] transition-transform duration-200">
        <div class="w-full h-[220px] rounded-control bg-surface-light-100/60 flex items-center justify-center relative overflow-hidden">
          <div class="flex gap-3">
            <div class="w-14 h-14 rounded-container bg-domain-purple-light/40"></div>
            <div class="w-14 h-14 rounded-container bg-domain-cyan-light/40"></div>
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <div class="w-5/6 h-6 rounded bg-content-primary"></div>
          <div class="w-2/3 h-6 rounded bg-content-primary"></div>
        </div>
      </div>

      <!-- Card 4: Feature Block -->
      <div class="w-full h-[420px] rounded-card bg-card-subtle p-8 md:p-10 border border-border-hairline shadow-subtle flex flex-col justify-between hover:scale-[1.01] transition-transform duration-200">
        <div class="w-full h-[220px] rounded-control bg-surface-light-100/60 flex items-center justify-center relative overflow-hidden">
          <div class="w-28 h-28 rounded-card bg-domain-amber-light/30 flex items-center justify-center">
            <div class="w-16 h-16 rounded-full bg-domain-amber-base/20"></div>
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <div class="w-4/5 h-6 rounded bg-content-primary"></div>
          <div class="w-3/5 h-6 rounded bg-content-primary"></div>
        </div>
      </div>

    </div>

  </div>
</section>
