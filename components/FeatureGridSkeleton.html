<!-- ==========================================================================
     OUTLIER ARCHETYPE: 2x2 FEATURE BENEFIT GRID SKELETON
     Aesthetic Mechanics:
     - Container: 1280px max-width, 100px 60px (Desktop), 56px 16px (Mobile)
     - Grid: 2 columns on desktop (gap: 24px), 1 column on mobile (gap: 16px)
     - Card Dimension: 420px height (Desktop) / min-h-[300px] (Mobile), 12px radius
     - Surface: Subtle depth gradient (linear-gradient(180deg, #FFFFFF 0%, #EEEEEE 100%))
     ========================================================================== -->

<section class="w-full py-14 sm:py-20 md:py-28 px-4 sm:px-6 md:px-14 flex flex-col items-center bg-white">
  <div class="max-w-page w-full mx-auto flex flex-col items-center gap-8 sm:gap-12">
    
    <!-- Section Header -->
    <div class="flex flex-col items-center text-center max-w-[800px] gap-3 px-2">
      <span class="text-[11px] sm:text-xs md:text-sm font-semibold tracking-[2px] uppercase text-brand-deep">
        <span class="inline-block w-40 h-3.5 rounded bg-brand-deep/30"></span>
      </span>
      <h2 class="text-2xl sm:text-3xl tablet:text-4xl desktop:text-[40px] font-semibold text-content-primary tracking-tight leading-[1.25] flex flex-col items-center gap-2">
        <span class="w-full max-w-[640px] h-8 sm:h-10 md:h-11 rounded-md bg-surface-light-400"></span>
        <span class="w-3/4 max-w-[480px] h-8 sm:h-10 md:h-11 rounded-md bg-surface-light-400"></span>
      </h2>
      <p class="text-sm sm:text-base text-content-tertiary max-w-[640px] flex flex-col items-center gap-2">
        <span class="w-full max-w-[560px] h-4 rounded bg-surface-light-300"></span>
      </p>
    </div>

    <!-- 2x2 Grid Container -->
    <div class="w-full max-w-content grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">
      
      <!-- Card 1 -->
      <div class="w-full min-h-[300px] md:h-[420px] rounded-2xl md:rounded-card bg-card-subtle p-5 sm:p-8 md:p-10 border border-border-hairline shadow-subtle flex flex-col justify-between hover:scale-[1.01] transition-transform duration-200">
        <div class="w-full h-[140px] sm:h-[180px] md:h-[220px] rounded-xl md:rounded-control bg-surface-light-100/60 flex items-center justify-center relative overflow-hidden mb-4 md:mb-0">
          <div class="w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 rounded-full bg-brand-primary/10 flex items-center justify-center">
            <div class="w-8 h-8 sm:w-10 sm:h-10 md:w-12 md:h-12 rounded-full bg-brand-primary/20"></div>
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <div class="w-4/5 h-5 sm:h-6 rounded bg-content-primary"></div>
          <div class="w-3/5 h-4 sm:h-5 rounded bg-content-tertiary/60"></div>
        </div>
      </div>

      <!-- Card 2 -->
      <div class="w-full min-h-[300px] md:h-[420px] rounded-2xl md:rounded-card bg-card-subtle p-5 sm:p-8 md:p-10 border border-border-hairline shadow-subtle flex flex-col justify-between hover:scale-[1.01] transition-transform duration-200">
        <div class="w-full h-[140px] sm:h-[180px] md:h-[220px] rounded-xl md:rounded-control bg-surface-light-100/60 flex items-center justify-center relative overflow-hidden mb-4 md:mb-0">
          <div class="px-5 py-2.5 sm:px-6 sm:py-3 rounded-pill bg-domain-lime-light/30 flex items-center justify-center">
            <div class="w-20 h-4 rounded bg-domain-lime-dark/30"></div>
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <div class="w-full h-5 sm:h-6 rounded bg-content-primary"></div>
          <div class="w-1/2 h-4 sm:h-5 rounded bg-content-tertiary/60"></div>
        </div>
      </div>

      <!-- Card 3 -->
      <div class="w-full min-h-[300px] md:h-[420px] rounded-2xl md:rounded-card bg-card-subtle p-5 sm:p-8 md:p-10 border border-border-hairline shadow-subtle flex flex-col justify-between hover:scale-[1.01] transition-transform duration-200">
        <div class="w-full h-[140px] sm:h-[180px] md:h-[220px] rounded-xl md:rounded-control bg-surface-light-100/60 flex items-center justify-center relative overflow-hidden gap-2 sm:gap-3 mb-4 md:mb-0">
          <div class="w-20 sm:w-24 h-6 sm:h-7 rounded-lg bg-domain-purple-light/40"></div>
          <div class="w-20 sm:w-24 h-6 sm:h-7 rounded-lg bg-domain-cyan-light/40"></div>
        </div>
        <div class="flex flex-col gap-2">
          <div class="w-4/5 h-5 sm:h-6 rounded bg-content-primary"></div>
          <div class="w-2/3 h-4 sm:h-5 rounded bg-content-tertiary/60"></div>
        </div>
      </div>

      <!-- Card 4 -->
      <div class="w-full min-h-[300px] md:h-[420px] rounded-2xl md:rounded-card bg-card-subtle p-5 sm:p-8 md:p-10 border border-border-hairline shadow-subtle flex flex-col justify-between hover:scale-[1.01] transition-transform duration-200">
        <div class="w-full h-[140px] sm:h-[180px] md:h-[220px] rounded-xl md:rounded-control bg-surface-light-100/60 flex items-center justify-center relative overflow-hidden mb-4 md:mb-0">
          <div class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-domain-amber-light/30 flex items-center justify-center">
            <div class="w-8 h-8 rounded-full bg-domain-amber-dark/20"></div>
          </div>
        </div>
        <div class="flex flex-col gap-2">
          <div class="w-3/4 h-5 sm:h-6 rounded bg-content-primary"></div>
          <div class="w-1/2 h-4 sm:h-5 rounded bg-content-tertiary/60"></div>
        </div>
      </div>

    </div>

  </div>
</section>
