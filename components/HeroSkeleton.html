<!-- ==========================================================================
     OUTLIER ARCHETYPE: HERO PRESENTATION SECTION SKELETON
     Aesthetic Mechanics:
     - Vertical stack rhythm: gap: 30px, padding: 60px 0px (Desktop), 40px 0px (Mobile)
     - Max width: 1280px container, content width: 840px text constraint
     - Background: Hero fade gradient (linear-gradient(180deg, #FBFBFB 0%, rgba(217, 217, 217, 0) 100%))
     - Display Typography: 54px desktop / 40px tablet / 36px mobile (-1.5px tracking, line-height: 120%)
     - Primary Button: Pill radius (120px), padding: 20px 54px, color: #F7803C
     ========================================================================== -->

<section class="w-full relative overflow-hidden bg-hero-fade pt-12 pb-16 md:py-20 flex flex-col items-center">
  
  <!-- Subtle Ambient Glow Orbs -->
  <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-brand-primary/10 rounded-full blur-[100px] pointer-events-none" aria-hidden="true"></div>
  <div class="absolute top-20 right-10 w-[300px] h-[300px] bg-domain-cyan-light/20 rounded-full blur-[80px] pointer-events-none" aria-hidden="true"></div>

  <div class="max-w-page w-full mx-auto px-6 md:px-10 flex flex-col items-center text-center relative z-10">
    
    <!-- Eyebrow Badge Slot -->
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-brand-tint-300 border border-brand-deep/20 mb-6">
      <span class="w-2 h-2 rounded-full bg-brand-deep animate-pulse"></span>
      <div class="h-3.5 w-36 rounded bg-brand-deep/30"></div>
    </div>

    <!-- Master Display Heading (H1) -->
    <h1 class="max-w-[840px] text-h1-mobile tablet:text-h1-tablet desktop:text-h1-desktop font-semibold text-content-primary tracking-tight leading-[1.2] mb-6 flex flex-col items-center gap-2">
      <span class="w-full max-w-[760px] h-12 md:h-14 rounded-md bg-surface-light-400"></span>
      <span class="w-3/4 max-w-[540px] h-12 md:h-14 rounded-md bg-surface-light-400"></span>
    </h1>

    <!-- Subtitle / Body Large -->
    <p class="max-w-[640px] text-body-sm md:text-body-lg text-content-tertiary leading-[1.5] mb-10 flex flex-col items-center gap-2">
      <span class="w-full max-w-[580px] h-5 rounded bg-surface-light-300"></span>
      <span class="w-4/5 max-w-[460px] h-5 rounded bg-surface-light-300"></span>
    </p>

    <!-- Primary Action Stack -->
    <div class="flex flex-col sm:flex-row items-center gap-4 mb-16">
      <a href="#" class="inline-flex items-center justify-center px-10 py-5 rounded-pill bg-brand-primary text-content-primary font-semibold text-lg transition-all duration-200 hover:bg-brand-hover hover:scale-[1.02] active:bg-brand-active active:scale-[0.98] shadow-glow-coral">
        <span class="w-36 h-4 rounded bg-content-primary/30"></span>
      </a>
    </div>

  </div>

  <!-- Infinite Marquee Ticker Mount Zone -->
  <div class="w-full overflow-hidden mt-4">
    <!-- Marquee component renders here -->
  </div>

</section>
