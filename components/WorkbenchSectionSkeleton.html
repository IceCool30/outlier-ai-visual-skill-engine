<!-- ==========================================================================
     OUTLIER ARCHETYPE: INTERACTIVE WORKBENCH & TABBED STAGE SKELETON
     Aesthetic Mechanics:
     - Section Rhythm: 100px 60px (Desktop), 80px 40px (Tablet), 56px 16px (Mobile)
     - Segmented Tab Bar: Stacked pill buttons on mobile, unified pill on desktop
     - Stage Container: 48px radius (Desktop) / 24px radius (Mobile)
     - Stage Gradient: linear-gradient(270deg, #F0FCFF 0%, #FFFFFF 50%, #FCEBE1 105%)
     - Two-Column Split: Explanatory metadata left, Code/Task simulator right
     - Code Simulator: overflow-x-auto whitespace-pre in Fragment Mono
     ========================================================================== -->

<section class="w-full py-14 sm:py-20 md:py-28 px-4 sm:px-6 md:px-14 flex flex-col items-center bg-surface-canvas">
  <div class="max-w-page w-full mx-auto flex flex-col items-center gap-8 sm:gap-12">
    
    <!-- Section Header Stack -->
    <div class="flex flex-col items-center text-center max-w-[780px] gap-3 px-2">
      <span class="text-[11px] sm:text-xs md:text-sm font-semibold tracking-[2px] uppercase text-brand-deep">
        <span class="inline-block w-40 sm:w-48 h-3.5 rounded bg-brand-deep/30"></span>
      </span>
      <h2 class="text-2xl sm:text-3xl tablet:text-4xl desktop:text-[40px] font-semibold text-content-primary tracking-tight leading-[1.25] flex flex-col items-center gap-2">
        <span class="w-full max-w-[620px] h-8 sm:h-10 md:h-11 rounded-md bg-surface-light-400"></span>
      </h2>
      <p class="text-sm sm:text-base text-content-tertiary max-w-[600px] flex flex-col items-center gap-2">
        <span class="w-full max-w-[520px] h-4 rounded bg-surface-light-300"></span>
      </p>
    </div>

    <!-- Segmented Tab Pill Controller (Stacked on mobile, unified pill on desktop) -->
    <div class="w-full max-w-content p-1.5 sm:p-2 md:p-3 rounded-2xl md:rounded-pill bg-surface-light-200 flex flex-col sm:flex-row gap-1.5 sm:gap-2 border border-border-hairline shadow-inner">
      
      <!-- Tab 1 (Active Pill Indicator) -->
      <button class="w-full sm:flex-1 py-2.5 sm:py-3.5 md:py-4 px-4 rounded-xl md:rounded-pill bg-white shadow-subtle flex items-center justify-center transition-all duration-200">
        <div class="w-32 sm:w-40 h-3.5 sm:h-4 rounded bg-content-primary"></div>
      </button>

      <!-- Tab 2 (Inactive) -->
      <button class="w-full sm:flex-1 py-2.5 sm:py-3.5 md:py-4 px-4 rounded-xl md:rounded-pill bg-transparent hover:bg-white/50 flex items-center justify-center transition-all duration-200">
        <div class="w-28 sm:w-36 h-3.5 sm:h-4 rounded bg-content-muted"></div>
      </button>

      <!-- Tab 3 (Inactive) -->
      <button class="w-full sm:flex-1 py-2.5 sm:py-3.5 md:py-4 px-4 rounded-xl md:rounded-pill bg-transparent hover:bg-white/50 flex items-center justify-center transition-all duration-200">
        <div class="w-28 sm:w-36 h-3.5 sm:h-4 rounded bg-content-muted"></div>
      </button>

    </div>

    <!-- Pearlescent Interactive Stage Surface (Fluid radii: 24px mobile, 48px desktop) -->
    <div class="w-full max-w-content rounded-[24px] sm:rounded-[32px] md:rounded-banner bg-workbench-pearlescent p-5 sm:p-8 md:p-14 border border-border-subtle/40 shadow-card flex flex-col lg:flex-row items-center gap-8 sm:gap-10 lg:gap-14">
      
      <!-- Left Column: Context Hierarchy -->
      <div class="flex-1 flex flex-col gap-6 sm:gap-8 w-full">
        
        <!-- Active Tab Title -->
        <div class="flex flex-col gap-2.5">
          <div class="w-56 sm:w-64 h-7 sm:h-8 rounded-md bg-content-primary"></div>
          <div class="w-full max-w-md h-3.5 sm:h-4 rounded bg-content-tertiary/40"></div>
        </div>

        <!-- Structured Metadata Blocks ("Why" and "How") -->
        <div class="space-y-3.5 sm:space-y-5">
          <div class="p-4 sm:p-6 rounded-xl md:rounded-container bg-white/80 backdrop-blur-sm border border-white/80 shadow-subtle flex flex-col gap-2">
            <div class="w-28 h-3 rounded bg-brand-deep/50"></div>
            <div class="w-full h-3.5 rounded bg-content-secondary/60"></div>
            <div class="w-3/4 h-3.5 rounded bg-content-secondary/60"></div>
          </div>

          <div class="p-4 sm:p-6 rounded-xl md:rounded-container bg-white/80 backdrop-blur-sm border border-white/80 shadow-subtle flex flex-col gap-2">
            <div class="w-36 h-3 rounded bg-brand-deep/50"></div>
            <div class="w-full h-3.5 rounded bg-content-secondary/60"></div>
            <div class="w-4/5 h-3.5 rounded bg-content-secondary/60"></div>
          </div>
        </div>

      </div>

      <!-- Right Column: Code Simulator Floating Window -->
      <div class="flex-1 w-full">
        <div class="w-full rounded-2xl md:rounded-container bg-white border border-border-hairline shadow-floating p-4 sm:p-6 md:p-8 flex flex-col gap-4 sm:gap-6">
          
          <!-- Terminal / Window Bar -->
          <div class="flex items-center justify-between pb-3 sm:pb-4 border-b border-border-hairline">
            <div class="flex items-center gap-1.5 sm:gap-2">
              <span class="w-2.5 sm:w-3 h-2.5 sm:h-3 rounded-full bg-[#FF5F56]"></span>
              <span class="w-2.5 sm:w-3 h-2.5 sm:h-3 rounded-full bg-[#FFBD2E]"></span>
              <span class="w-2.5 sm:w-3 h-2.5 sm:h-3 rounded-full bg-[#27C93F]"></span>
            </div>
            <div class="w-20 h-4 rounded bg-surface-light-200"></div>
          </div>

          <!-- Code Editor Body (Fragment Mono, Scrollable on touch) -->
          <div class="rounded-lg md:rounded-control bg-surface-light-100 p-3.5 sm:p-4 border border-border-hairline overflow-x-auto whitespace-pre font-mono text-xs md:text-[13px] leading-relaxed flex flex-col gap-2">
            <div class="w-3/4 h-3 rounded bg-content-primary/30"></div>
            <div class="w-1/2 h-3 rounded bg-brand-link/40 ml-4"></div>
            <div class="w-2/3 h-3 rounded bg-domain-purple-dark/40 ml-4"></div>
            <div class="w-1/3 h-3 rounded bg-domain-lime-dark/40 ml-4"></div>
            <div class="w-1/4 h-3 rounded bg-content-primary/30"></div>
          </div>

          <!-- Validation Checklist -->
          <div class="space-y-2.5 sm:space-y-3">
            <div class="flex items-center justify-between p-2.5 sm:p-3.5 rounded-lg md:rounded-control bg-surface-light-50 border border-border-hairline">
              <div class="flex items-center gap-2.5">
                <div class="w-4 h-4 rounded bg-domain-lime-base"></div>
                <div class="w-36 h-3 rounded bg-content-primary/70"></div>
              </div>
              <div class="w-14 h-4 rounded-badge bg-domain-lime-bg"></div>
            </div>

            <div class="flex items-center justify-between p-2.5 sm:p-3.5 rounded-lg md:rounded-control bg-surface-light-50 border border-border-hairline">
              <div class="flex items-center gap-2.5">
                <div class="w-4 h-4 rounded bg-domain-purple-base"></div>
                <div class="w-40 h-3 rounded bg-content-primary/70"></div>
              </div>
              <div class="w-14 h-4 rounded-badge bg-domain-purple-bg"></div>
            </div>
          </div>

          <!-- Action Trigger -->
          <div class="flex justify-end pt-1 sm:pt-2">
            <div class="w-full sm:w-36 h-9 sm:h-10 rounded-pill bg-brand-primary"></div>
          </div>

        </div>
      </div>

    </div>

  </div>
</section>
