<!-- ==========================================================================
     OUTLIER ARCHETYPE: INTERACTIVE WORKBENCH & TABBED STAGE SKELETON
     Aesthetic Mechanics:
     - Section Rhythm: 100px 60px padding, 48px stack gap
     - Segmented Pill Tab Bar: 96px height, 16px padding, 120px radius, bg: #F5F5F5
     - Active Tab Pill: 120px radius, 64px height, bg: #FFFFFF, shadow-subtle
     - Stage Container: 48px radius, 60px padding
     - Stage Gradient: linear-gradient(270deg, #F0FCFF 0%, #FFFFFF 50%, #FCEBE1 105%)
     - Two-Column Split: Explanatory metadata left, Code/Task simulator right
     ========================================================================== -->

<section class="w-full py-16 md:py-24 px-6 md:px-14 flex flex-col items-center bg-surface-canvas">
  <div class="max-w-page w-full mx-auto flex flex-col items-center gap-12">
    
    <!-- Section Header Stack -->
    <div class="flex flex-col items-center text-center max-w-[780px] gap-4">
      <span class="text-eyebrow-sm md:text-eyebrow font-semibold tracking-[2px] uppercase text-brand-deep">
        <span class="inline-block w-48 h-3.5 rounded bg-brand-deep/30"></span>
      </span>
      <h2 class="text-h2-mobile tablet:text-h2-tablet desktop:text-h2-desktop font-semibold text-content-primary tracking-tight leading-[1.3] flex flex-col items-center gap-2">
        <span class="w-full max-w-[620px] h-9 md:h-11 rounded-md bg-surface-light-400"></span>
      </h2>
      <p class="text-body-sm md:text-body-md text-content-tertiary max-w-[600px] flex flex-col items-center gap-2">
        <span class="w-full max-w-[520px] h-4 rounded bg-surface-light-300"></span>
      </p>
    </div>

    <!-- Segmented Tab Pill Controller -->
    <div class="w-full max-w-content h-20 md:h-24 p-3 md:p-4 rounded-pill bg-surface-light-200 flex items-center gap-2 border border-border-hairline shadow-inner">
      
      <!-- Tab 1 (Active Pill Indicator) -->
      <button class="flex-1 h-full rounded-pill bg-white shadow-subtle flex items-center justify-center px-4 transition-all duration-200">
        <div class="w-40 h-4 rounded bg-content-primary"></div>
      </button>

      <!-- Tab 2 (Inactive) -->
      <button class="flex-1 h-full rounded-pill bg-transparent hover:bg-white/50 flex items-center justify-center px-4 transition-all duration-200">
        <div class="w-36 h-4 rounded bg-content-muted"></div>
      </button>

      <!-- Tab 3 (Inactive) -->
      <button class="flex-1 h-full rounded-pill bg-transparent hover:bg-white/50 flex items-center justify-center px-4 transition-all duration-200">
        <div class="w-36 h-4 rounded bg-content-muted"></div>
      </button>

    </div>

    <!-- Pearlescent Interactive Stage Surface -->
    <div class="w-full max-w-content rounded-banner bg-workbench-pearlescent p-8 md:p-14 border border-border-subtle/40 shadow-card flex flex-col lg:flex-row items-center gap-10 lg:gap-14">
      
      <!-- Left Column: Instructional / Context Hierarchy -->
      <div class="flex-1 flex flex-col gap-8 w-full">
        
        <!-- Active Tab Title -->
        <div class="flex flex-col gap-3">
          <div class="w-64 h-8 rounded-md bg-content-primary"></div>
          <div class="w-full max-w-md h-4 rounded bg-content-tertiary/40"></div>
        </div>

        <!-- Structured Metadata Blocks ("Why" and "How") -->
        <div class="space-y-6">
          <!-- Block A: Rationale -->
          <div class="p-5 rounded-container bg-white/70 backdrop-blur-sm border border-white/60 shadow-subtle">
            <div class="w-16 h-4 rounded bg-brand-deep/80 mb-2 font-mono text-xs"></div>
            <div class="space-y-2">
              <div class="w-full h-3 rounded bg-content-tertiary/30"></div>
              <div class="w-4/5 h-3 rounded bg-content-tertiary/30"></div>
            </div>
          </div>

          <!-- Block B: Operational Routine -->
          <div class="p-5 rounded-container bg-white/70 backdrop-blur-sm border border-white/60 shadow-subtle">
            <div class="w-16 h-4 rounded bg-brand-deep/80 mb-2 font-mono text-xs"></div>
            <div class="space-y-2">
              <div class="w-full h-3 rounded bg-content-tertiary/30"></div>
              <div class="w-3/4 h-3 rounded bg-content-tertiary/30"></div>
            </div>
          </div>
        </div>

      </div>

      <!-- Right Column: Interactive Code / Task Simulator Workbench -->
      <div class="flex-1 w-full">
        <div class="w-full rounded-container bg-white border border-border-hairline shadow-floating p-6 md:p-8 flex flex-col gap-6">
          
          <!-- Workbench Card Topbar -->
          <div class="flex items-center justify-between pb-4 border-b border-border-hairline">
            <div class="flex items-center gap-2">
              <div class="w-3 h-3 rounded-full bg-[#FF5F56]"></div>
              <div class="w-3 h-3 rounded-full bg-[#FFBD2E]"></div>
              <div class="w-3 h-3 rounded-full bg-[#27C93F]"></div>
            </div>
            <div class="w-24 h-4 rounded-badge bg-surface-light-300 font-mono text-xs"></div>
          </div>

          <!-- Code / Editor Prompt Surface (Fragment Mono) -->
          <div class="rounded-control bg-surface-light-100 p-4 font-mono text-sm border border-border-hairline space-y-2">
            <div class="w-3/4 h-3.5 rounded bg-content-tertiary/50"></div>
            <div class="w-full h-3.5 rounded bg-content-tertiary/30"></div>
            <div class="w-2/3 h-3.5 rounded bg-content-tertiary/40"></div>
          </div>

          <!-- Rubric Assessment Checklist Rows -->
          <div class="space-y-3">
            <div class="flex items-center justify-between p-3 rounded-control bg-surface-light-50 border border-border-hairline">
              <div class="flex items-center gap-3">
                <div class="w-4 h-4 rounded bg-domain-lime-base"></div>
                <div class="w-36 h-3 rounded bg-content-tertiary/40"></div>
              </div>
              <div class="w-12 h-4 rounded-badge bg-domain-lime-bg"></div>
            </div>

            <div class="flex items-center justify-between p-3 rounded-control bg-surface-light-50 border border-border-hairline">
              <div class="flex items-center gap-3">
                <div class="w-4 h-4 rounded bg-domain-purple-base"></div>
                <div class="w-44 h-3 rounded bg-content-tertiary/40"></div>
              </div>
              <div class="w-12 h-4 rounded-badge bg-domain-purple-bg"></div>
            </div>
          </div>

          <!-- Workbench Action Pill -->
          <div class="flex justify-end pt-2">
            <div class="h-9 px-6 rounded-pill bg-brand-primary flex items-center justify-center">
              <div class="w-20 h-3 rounded bg-content-primary/30"></div>
            </div>
          </div>

        </div>
      </div>

    </div>

  </div>
</section>
