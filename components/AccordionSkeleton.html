<!-- ==========================================================================
     OUTLIER ARCHETYPE: MINIMAL ACCORDION ROW SKELETON
     Aesthetic Mechanics:
     - Section Rhythm: 100px 60px padding, 48px gap
     - Container Max-Width: 1040px (narrow-max centered)
     - Row Divider: border-b border-border-hairline
     - Padding: 28px 0px per row
     - Typography: Header 20px font-weight: 500, Body 20px font-weight: 400, line-height: 1.8 (36px)
     - Interactive Toggle: Chevron SVG 14px x 9px, transition-transform duration-200
     ========================================================================== -->

<section class="w-full py-16 md:py-24 px-6 md:px-14 flex flex-col items-center bg-surface-canvas">
  <div class="max-w-page w-full mx-auto flex flex-col items-center gap-12">
    
    <!-- Section Header -->
    <div class="flex flex-col items-center text-center max-w-[800px] gap-4">
      <span class="text-eyebrow-sm md:text-eyebrow font-semibold tracking-[2px] uppercase text-brand-deep">
        <span class="inline-block w-44 h-3.5 rounded bg-brand-deep/30"></span>
      </span>
      <h2 class="text-h2-mobile tablet:text-h2-tablet desktop:text-h2-desktop font-semibold text-content-primary tracking-tight leading-[1.3] flex flex-col items-center gap-2">
        <span class="w-full max-w-[480px] h-9 md:h-11 rounded-md bg-surface-light-400"></span>
      </h2>
    </div>

    <!-- Centered Accordion Stack -->
    <div class="w-full max-w-narrow mx-auto flex flex-col">
      
      <!-- Accordion Item 1 (Expanded State) -->
      <div class="w-full border-b border-border-light/80 py-7 flex flex-col gap-4">
        <div class="w-full flex items-center justify-between cursor-pointer group">
          <div class="w-2/3 h-5 rounded bg-content-primary group-hover:bg-brand-deep transition-colors"></div>
          <svg class="w-4 h-2.5 text-content-primary rotate-180 transition-transform duration-200" viewBox="0 0 14 9" fill="none" stroke="currentColor">
            <path d="M1 8L7 2L13 8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <!-- Collapsible Content -->
        <div class="space-y-2 pt-2 text-body-lg text-content-secondary leading-[1.8]">
          <div class="w-full h-4 rounded bg-content-tertiary/30"></div>
          <div class="w-full h-4 rounded bg-content-tertiary/30"></div>
          <div class="w-4/5 h-4 rounded bg-content-tertiary/30"></div>
        </div>
      </div>

      <!-- Accordion Item 2 (Collapsed State) -->
      <div class="w-full border-b border-border-light/80 py-7 flex flex-col gap-4">
        <div class="w-full flex items-center justify-between cursor-pointer group">
          <div class="w-3/4 h-5 rounded bg-content-primary group-hover:bg-brand-deep transition-colors"></div>
          <svg class="w-4 h-2.5 text-content-primary transition-transform duration-200" viewBox="0 0 14 9" fill="none" stroke="currentColor">
            <path d="M1 1L7 7L13 1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- Accordion Item 3 (Collapsed State) -->
      <div class="w-full border-b border-border-light/80 py-7 flex flex-col gap-4">
        <div class="w-full flex items-center justify-between cursor-pointer group">
          <div class="w-1/2 h-5 rounded bg-content-primary group-hover:bg-brand-deep transition-colors"></div>
          <svg class="w-4 h-2.5 text-content-primary transition-transform duration-200" viewBox="0 0 14 9" fill="none" stroke="currentColor">
            <path d="M1 1L7 7L13 1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- Accordion Item 4 (Collapsed State) -->
      <div class="w-full border-b border-border-light/80 py-7 flex flex-col gap-4">
        <div class="w-full flex items-center justify-between cursor-pointer group">
          <div class="w-3/5 h-5 rounded bg-content-primary group-hover:bg-brand-deep transition-colors"></div>
          <svg class="w-4 h-2.5 text-content-primary transition-transform duration-200" viewBox="0 0 14 9" fill="none" stroke="currentColor">
            <path d="M1 1L7 7L13 1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

      <!-- Accordion Item 5 (Collapsed State) -->
      <div class="w-full border-b border-border-light/80 py-7 flex flex-col gap-4">
        <div class="w-full flex items-center justify-between cursor-pointer group">
          <div class="w-2/3 h-5 rounded bg-content-primary group-hover:bg-brand-deep transition-colors"></div>
          <svg class="w-4 h-2.5 text-content-primary transition-transform duration-200" viewBox="0 0 14 9" fill="none" stroke="currentColor">
            <path d="M1 1L7 7L13 1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>

    </div>

  </div>
</section>
