<!-- ==========================================================================
     OUTLIER ARCHETYPE: DUAL-CARD MARQUEE TICKER SKELETON
     Aesthetic Mechanics:
     - Continuous horizontal translate animation (marquee 35s linear infinite)
     - Track gap: 20px
     - Column dimension: 209px width, 400px height
     - Dual Card Composition:
       * Type A (Profile Media Card): 209px x 296px, 12px radius, gradient overlay
       * Type B (Metric Stat Card): 209px x 127px, 12px radius, high-saturation gradient
     ========================================================================== -->

<div class="w-full overflow-hidden py-4 select-none relative" aria-hidden="true">
  
  <!-- Edge Gradient Masking (Left & Right Fades) -->
  <div class="absolute left-0 top-0 bottom-0 w-24 bg-gradient-to-r from-surface-canvas to-transparent z-10 pointer-events-none"></div>
  <div class="absolute right-0 top-0 bottom-0 w-24 bg-gradient-to-l from-surface-canvas to-transparent z-10 pointer-events-none"></div>

  <!-- Animated Track -->
  <div class="flex gap-5 w-max animate-marquee hover:[animation-play-state:paused]">
    
    <!-- REPEATED SEQUENCE 1 -->
    <!-- Column 1: Profile Card -->
    <div class="w-[209px] h-[400px] flex flex-col justify-end">
      <div class="w-[209px] h-[296px] rounded-card bg-surface-light-300 relative overflow-hidden flex flex-col justify-end p-4 border border-border-hairline shadow-subtle">
        <div class="absolute inset-0 bg-gradient-to-t from-[#163F57]/90 via-[#163F57]/30 to-transparent"></div>
        <div class="relative z-10 flex flex-col gap-1.5">
          <div class="h-4 w-20 rounded bg-white/80"></div>
          <div class="h-3 w-28 rounded bg-white/50"></div>
        </div>
      </div>
    </div>

        <div class="h-4 w-32 rounded bg-white/70"></div>
