<!-- ==========================================================================

        <div class="space-y-3">
          <div class="w-24 h-3.5 rounded bg-content-tertiary/50 hover:bg-brand-link transition-colors cursor-pointer"></div>

        <div class="w-24 h-4 rounded bg-content-primary"></div>

          <div class="w-32 h-3.5 rounded bg-content-tertiary/50 hover:bg-brand-link transition-colors cursor-pointer"></div>
          <div class="w-28 h-3.5 rounded bg-content-tertiary/50 hover:bg-brand-link transition-colors cursor-pointer"></div>
          <div class="w-24 h-3.5 rounded bg-content-tertiary/50 hover:bg-brand-link transition-colors cursor-pointer"></div>

        </div>

          <div class="w-24 h-3.5 rounded bg-content-tertiary/50 hover:bg-brand-link transition-colors cursor-pointer"></div>
        </div>

    </div>

    <!-- Bottom Utility Bar -->
    <div class="w-full pt-8 border-t border-border-hairline flex flex-col md:flex-row items-center justify-between gap-4 text-xs font-mono text-content-tertiary">
      <div class="w-64 h-3.5 rounded bg-content-tertiary/30"></div>
      
      <div class="flex items-center gap-6">
        <div class="w-20 h-3.5 rounded bg-content-tertiary/30 hover:bg-brand-link cursor-pointer"></div>
        <div class="w-24 h-3.5 rounded bg-content-tertiary/30 hover:bg-brand-link cursor-pointer"></div>
