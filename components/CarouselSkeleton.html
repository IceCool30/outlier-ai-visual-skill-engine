<!-- ==========================================================================
     OUTLIER ARCHETYPE: TESTIMONIALS CAROUSEL SKELETON
     Aesthetic Mechanics:
     - Card Dimension: 340px width, 604px height, 12px radius
     - Upper Media Viewport: aspect-ratio: 9/16, video/avatar container
     - Quote Typography: 20px desktop / 18px tablet / 16px mobile, italic, line-height: 2.0 (40px)
     - Quote Color: #1A1C1E
     - Control Buttons: Circular 54px x 54px, 40px radius, bg: #DDDDDD, arrow indicators
     ========================================================================== -->

<section class="w-full py-16 md:py-24 px-6 md:px-14 flex flex-col items-center bg-surface-light-50">
  <div class="max-w-page w-full mx-auto flex flex-col items-center gap-12">
    
    <!-- Section Header -->
    <div class="flex flex-col items-center text-center max-w-[800px] gap-4">
      <span class="text-eyebrow-sm md:text-eyebrow font-semibold tracking-[2px] uppercase text-brand-deep">
        <span class="inline-block w-32 h-3.5 rounded bg-brand-deep/30"></span>
      </span>
      <h2 class="text-h2-mobile tablet:text-h2-tablet desktop:text-h2-desktop font-semibold text-content-primary tracking-tight leading-[1.3] flex flex-col items-center gap-2">
        <span class="w-full max-w-[620px] h-9 md:h-11 rounded-md bg-surface-light-400"></span>
      </h2>
    </div>

    <!-- Carousel Viewport & Sliding Track -->
    <div class="w-full max-w-content relative overflow-hidden">
      
      <div class="flex gap-6 overflow-x-auto pb-4 scrollbar-none snap-x snap-mandatory">
        
        <!-- Testimonial Card 1 -->
        <div class="min-w-[320px] md:min-w-[340px] h-[604px] rounded-card bg-white border border-border-hairline shadow-subtle p-5 flex flex-col justify-between snap-start">
          <!-- Media Slot (Video / Screen) -->
          <div class="w-full h-[360px] rounded-card bg-surface-light-200 relative overflow-hidden flex items-center justify-center">
            <div class="w-14 h-14 rounded-full bg-white/90 shadow-floating flex items-center justify-center">
              <div class="w-0 h-0 border-y-8 border-y-transparent border-l-12 border-l-content-primary ml-1"></div>
            </div>
          </div>
          <!-- Quote Block -->
          <div class="space-y-3 pt-2">
            <div class="space-y-2">
              <div class="w-full h-3 rounded bg-content-primary/80"></div>
              <div class="w-full h-3 rounded bg-content-primary/80"></div>
              <div class="w-3/4 h-3 rounded bg-content-primary/80"></div>
            </div>
            <!-- Author Lockup -->
            <div class="pt-3 border-t border-border-hairline flex flex-col gap-1">
              <div class="w-24 h-4 rounded bg-content-primary"></div>
              <div class="w-36 h-3 rounded bg-content-tertiary/40"></div>
            </div>
          </div>
        </div>

        <!-- Testimonial Card 2 -->
        <div class="min-w-[320px] md:min-w-[340px] h-[604px] rounded-card bg-white border border-border-hairline shadow-subtle p-5 flex flex-col justify-between snap-start">
          <div class="w-full h-[360px] rounded-card bg-surface-light-200 relative overflow-hidden flex items-center justify-center">
            <div class="w-14 h-14 rounded-full bg-white/90 shadow-floating flex items-center justify-center">
              <div class="w-0 h-0 border-y-8 border-y-transparent border-l-12 border-l-content-primary ml-1"></div>
            </div>
          </div>
          <div class="space-y-3 pt-2">
            <div class="space-y-2">
              <div class="w-full h-3 rounded bg-content-primary/80"></div>
              <div class="w-full h-3 rounded bg-content-primary/80"></div>
              <div class="w-2/3 h-3 rounded bg-content-primary/80"></div>
            </div>
            <div class="pt-3 border-t border-border-hairline flex flex-col gap-1">
              <div class="w-28 h-4 rounded bg-content-primary"></div>
              <div class="w-32 h-3 rounded bg-content-tertiary/40"></div>
            </div>
          </div>
        </div>

        <!-- Testimonial Card 3 -->
        <div class="min-w-[320px] md:min-w-[340px] h-[604px] rounded-card bg-white border border-border-hairline shadow-subtle p-5 flex flex-col justify-between snap-start">
          <div class="w-full h-[360px] rounded-card bg-surface-light-200 relative overflow-hidden flex items-center justify-center">
            <div class="w-14 h-14 rounded-full bg-white/90 shadow-floating flex items-center justify-center">
              <div class="w-0 h-0 border-y-8 border-y-transparent border-l-12 border-l-content-primary ml-1"></div>
            </div>
          </div>
          <div class="space-y-3 pt-2">
            <div class="space-y-2">
              <div class="w-full h-3 rounded bg-content-primary/80"></div>
              <div class="w-full h-3 rounded bg-content-primary/80"></div>
              <div class="w-4/5 h-3 rounded bg-content-primary/80"></div>
            </div>
            <div class="pt-3 border-t border-border-hairline flex flex-col gap-1">
              <div class="w-24 h-4 rounded bg-content-primary"></div>
              <div class="w-40 h-3 rounded bg-content-tertiary/40"></div>
            </div>
          </div>
        </div>

      </div>

      <!-- Navigation Arrows Stack -->
      <div class="flex items-center justify-center gap-4 mt-8">
        <button class="w-[54px] h-[54px] rounded-full bg-border-light hover:bg-surface-light-400 flex items-center justify-center transition-colors shadow-subtle" aria-label="Previous Slide">
          <svg class="w-5 h-5 text-content-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
        </button>
        <button class="w-[54px] h-[54px] rounded-full bg-border-light hover:bg-surface-light-400 flex items-center justify-center transition-colors shadow-subtle" aria-label="Next Slide">
          <svg class="w-5 h-5 text-content-primary" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

    </div>

  </div>
</section>
