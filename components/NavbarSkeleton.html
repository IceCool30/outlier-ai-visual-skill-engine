<!-- ==========================================================================
     OUTLIER ARCHETYPE: FLOATING NAVIGATION HEADER SKELETON
     Aesthetic Mechanics:
     - Fixed/Sticky top staging with z-index: 50
     - Container width: 1280px max-width, center aligned
     - Height: 76px (Desktop) / 68px (Mobile)
     - Structural distribution: Space-between flex alignment
     - Action element: Pill-shaped CTA button (border-radius: 120px, bg: #F7803C)
     - Mobile Drawer: Solid white, elevation shadow, z-index: 50
     ========================================================================== -->

<header class="w-full h-[68px] sm:h-[76px] sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-border-hairline transition-all duration-200">
  <div class="max-w-page mx-auto h-full px-4 sm:px-6 md:px-10 flex items-center justify-between">
    
    <!-- Brand Mark Slot -->
    <div class="flex items-center gap-2.5 sm:gap-3 cursor-pointer shrink-0">
      <div class="w-7 h-7 sm:w-9 sm:h-9 rounded-lg bg-content-primary flex items-center justify-center" aria-hidden="true">
        <div class="w-3 h-3 sm:w-4 sm:h-4 rounded-full bg-brand-primary"></div>
      </div>
      <div class="h-4 sm:h-5 w-20 sm:w-24 rounded bg-surface-light-400"></div>
    </div>

    <!-- Center Navigation Links (Desktop) -->
    <nav class="hidden md:flex items-center gap-8">
      <div class="h-4 w-16 rounded bg-surface-light-400 hover:bg-content-secondary transition-colors cursor-pointer"></div>
      <div class="h-4 w-20 rounded bg-surface-light-400 hover:bg-content-secondary transition-colors cursor-pointer"></div>
      <div class="h-4 w-12 rounded bg-surface-light-400 hover:bg-content-secondary transition-colors cursor-pointer"></div>
      <div class="h-4 w-16 rounded bg-surface-light-400 hover:bg-content-secondary transition-colors cursor-pointer"></div>
    </nav>

    <!-- Right Utility & Action Slot -->
    <div class="flex items-center gap-3 sm:gap-4">
      <div class="hidden sm:block h-4 w-12 rounded bg-surface-light-400 cursor-pointer"></div>
      
      <!-- Primary Pill CTA Button (Responsive) -->
      <a href="#" class="inline-flex items-center justify-center h-9 sm:h-10 px-4 sm:px-5 rounded-pill bg-brand-primary text-content-primary font-medium text-xs sm:text-sm transition-all duration-200 hover:bg-brand-hover hover:scale-[1.02] active:bg-brand-active shadow-subtle shrink-0">
        <span class="w-16 sm:w-24 h-3.5 rounded bg-content-primary/20"></span>
      </a>
      
      <!-- Mobile Hamburger Menu Button -->
      <button class="md:hidden p-2 rounded-lg text-content-primary hover:bg-surface-light-100 transition-colors" aria-label="Toggle Navigation">
        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>

  </div>

  <!-- Mobile Slide-Down Menu Drawer Skeleton (Opaque Solid White, High Elevation) -->
  <div class="hidden md:hidden fixed inset-x-0 top-[68px] sm:top-[76px] bg-white border-b border-border-hairline shadow-drawer px-6 py-6 flex flex-col gap-4 z-50">
    <div class="h-4 w-24 rounded bg-surface-light-400"></div>
    <div class="h-4 w-32 rounded bg-surface-light-400"></div>
    <div class="h-4 w-28 rounded bg-surface-light-400"></div>
    <div class="h-4 w-20 rounded bg-surface-light-400"></div>
    <div class="pt-3 border-t border-border-hairline">
      <div class="w-full h-11 rounded-pill bg-brand-primary"></div>
    </div>
  </div>
</header>
