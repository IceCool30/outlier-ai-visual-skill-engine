<!-- ==========================================================================
     OUTLIER ARCHETYPE: FLOATING NAVIGATION HEADER SKELETON
     Aesthetic Mechanics:
     - Fixed/Sticky top staging with z-index: 50
     - Container width: 1280px max-width, center aligned
     - Height: 79px
     - Structural distribution: Space-between flex alignment
     - Action element: Pill-shaped CTA button (border-radius: 120px, bg: #F7803C)
     ========================================================================== -->

<header class="w-full h-[79px] sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-border-hairline transition-all duration-200">
  <div class="max-w-page mx-auto h-full px-6 md:px-10 flex items-center justify-between">
    
    <!-- Brand Mark Slot -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-content-primary flex items-center justify-center" aria-hidden="true">
        <div class="w-4 h-4 rounded-full bg-brand-primary"></div>
      </div>
      <div class="h-5 w-24 rounded bg-surface-light-400"></div>
    </div>

    <!-- Center Navigation Links -->
    <nav class="hidden md:flex items-center gap-8">
      <div class="h-4 w-16 rounded bg-surface-light-400 hover:bg-content-secondary transition-colors cursor-pointer"></div>
      <div class="h-4 w-20 rounded bg-surface-light-400 hover:bg-content-secondary transition-colors cursor-pointer"></div>
      <div class="h-4 w-12 rounded bg-surface-light-400 hover:bg-content-secondary transition-colors cursor-pointer"></div>
      <div class="h-4 w-16 rounded bg-surface-light-400 hover:bg-content-secondary transition-colors cursor-pointer"></div>
    </nav>

    <!-- Right Utility & Action Slot -->
    <div class="flex items-center gap-4">
      <div class="hidden sm:block h-4 w-12 rounded bg-surface-light-400 cursor-pointer"></div>
      
      <!-- Primary Pill CTA Button -->
      <a href="#" class="inline-flex items-center justify-center h-10 px-5 rounded-pill bg-brand-primary text-content-primary font-medium text-sm transition-all duration-200 hover:bg-brand-hover hover:scale-[1.02] active:bg-brand-active active:scale-[0.98] shadow-subtle">
        <span class="w-24 h-3.5 rounded bg-content-primary/20"></span>
      </a>
      
      <!-- Mobile Menu Trigger -->
      <button class="md:hidden w-10 h-10 rounded-full flex flex-col items-center justify-center gap-1.5 bg-surface-light-200" aria-label="Toggle Navigation">
        <span class="w-5 h-0.5 bg-content-primary rounded-full"></span>
        <span class="w-5 h-0.5 bg-content-primary rounded-full"></span>
      </button>
    </div>

  </div>
</header>
